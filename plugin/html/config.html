<style>
  .krc-root { max-width: 760px; margin: 16px auto; font-size: 14px; color: #333; }
  .krc-section { margin: 0 0 24px; padding: 12px 16px; border: 1px solid #e3e7e8; border-radius: 4px; }
  .krc-section h2 { margin: 0 0 4px; font-size: 16px; }
  .krc-help { margin: 0 0 8px; color: #666; font-size: 12px; }
  .krc-radio, .krc-check { display: block; margin: 4px 0; }
  .krc-list { max-height: 180px; overflow-y: auto; margin: 4px 0 8px; padding: 4px 8px; border: 1px solid #e3e7e8; }
  .krc-kind-row { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
  .krc-kind-label { flex: 1; }
  .krc-textarea { width: 100%; box-sizing: border-box; }
  .krc-error { min-height: 20px; margin: 8px 0; color: #d9534f; white-space: pre-wrap; }
  .krc-buttons button { margin-right: 8px; padding: 6px 20px; cursor: pointer; }
</style>
<div class="krc-root">
  <section class="krc-section">
    <h2>対象者</h2>
    <p class="krc-help">行クリックで詳細へ遷移する機能を使うユーザーを選びます。これはアクセス制限ではありません。</p>
    <div id="krc-target-mode"></div>
    <div id="krc-target-detail">
      <p class="krc-help" id="krc-target-note"></p>
      <h3>組織</h3>
      <div id="krc-organizations" class="krc-list"></div>
      <label class="krc-check"><input type="checkbox" id="krc-include-child"> 下位組織を含める</label>
      <h3>グループ</h3>
      <div id="krc-groups" class="krc-list"></div>
    </div>
  </section>
  <section class="krc-section">
    <h2>対象一覧</h2>
    <p class="krc-help">表形式の一覧のみ対象です。</p>
    <div id="krc-views-mode"></div>
    <div id="krc-views" class="krc-list"></div>
  </section>
  <section class="krc-section">
    <h2>クリック範囲</h2>
    <p class="krc-help">指定フィールドの列のみにした場合、テーブル内の列は範囲外になります。</p>
    <div id="krc-range-mode"></div>
    <div id="krc-fields" class="krc-list"></div>
  </section>
  <section class="krc-section">
    <h2>項目種別ごとの動作</h2>
    <p class="krc-help">既定は「リンク先（標準動作）優先」です。「レコード詳細優先」にすると、そのセル内のリンクなどをクリックしても詳細へ遷移します。</p>
    <div id="krc-kinds"></div>
  </section>
  <div class="krc-error" id="krc-error" role="alert"></div>
  <div class="krc-buttons">
    <button type="button" id="krc-save">保存</button>
    <button type="button" id="krc-cancel">キャンセル</button>
  </div>
</div>
